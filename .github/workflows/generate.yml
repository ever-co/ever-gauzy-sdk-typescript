name: Generate SDK

on:
  workflow_dispatch:
  repository_dispatch:
    types: [spec-updated]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'

      - name: Install Kiota
        run: dotnet tool install --global Microsoft.OpenApi.Kiota

      - name: Generate SDK
        run: |
          kiota generate \
            --openapi https://api.gauzy.co/swg-json \
            --language Java \
            --class-name EverGauzyApiClient \
            --namespace-name co.ever.gauzy.sdk \
            --output ./src/main/java/co/ever/gauzy/sdk \
            --clean-output

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build & test
        run: |
          mvn compile
          mvn test || echo "No tests yet"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: 'chore: regenerate SDK from latest API spec'
          branch: sdk/regenerate
          commit-message: 'chore: regenerate SDK from latest API spec'
          body: |
            Auto-generated SDK update from the latest Gauzy API OpenAPI spec.

            Source: https://api.gauzy.co/swg-json
